# Netlify deployment configuration for Student Pulse Frontend
# Built with Vite — outputs to dist/

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Allow Google OAuth popup to communicate with parent window
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Static asset caching (Vite hashes filenames for cache-busting)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback for client-side routing (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

