# Netlify deployment configuration for Student Pulse Frontend

[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"

# Static file caching
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
