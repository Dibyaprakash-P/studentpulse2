# Render.com deployment blueprint for Student Pulse Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: student-pulse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-pulse-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ML_MODEL_PATH
        value: app/ml/model.pkl

databases:
  - name: student-pulse-db
    plan: free
    databaseName: student_pulse
