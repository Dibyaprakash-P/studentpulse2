# ────────────────────────────────────────────────────────────────
# Student Pulse — CI/CD Pipeline (GitHub Actions)
# ────────────────────────────────────────────────────────────────
# Triggers on push to main branch.
# - Backend: Lint, build Docker image (no publish — Render builds from source)
# - Frontend: Install, lint, build Vite production bundle
# ────────────────────────────────────────────────────────────────

name: StudentPulse CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend CI ───────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff (if available)
        run: |
          pip install ruff
          ruff check . --select E,W,F --ignore E501
        continue-on-error: true

      - name: Verify imports and app startup
        run: |
          python -c "from app.main import app; print('✅ App imports OK')"

      - name: Build Docker image (validation only)
        run: |
          docker build -t studentpulse-api:ci .

  # ── Frontend CI ──────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Verify build output
        run: |
          ls -la dist/
          echo "✅ Build output verified"

  # ── Deploy Notification ──────────────────────────────────────
  deploy-notify:
    name: Deploy Ready
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deployment summary
        run: |
          echo "═══════════════════════════════════════════"
          echo "  ✅ All CI checks passed!"
          echo "  🚀 Render will auto-deploy backend from source"
          echo "  🌐 Netlify will auto-deploy frontend from source"
          echo "═══════════════════════════════════════════"
